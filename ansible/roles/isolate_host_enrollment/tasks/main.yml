---
- name: Validate enrollment inputs
  ansible.builtin.assert:
    that:
      - isolate_enrollment_bastion is defined
      - isolate_enrollment_bastion in hostvars
      - isolate_enrollment_api_origin is defined
      - isolate_enrollment_api_origin is match('^https://(\[[0-9A-Fa-f:]+\]|[A-Za-z0-9.-]+)(:[0-9]{1,5})?/?$')
      - isolate_enrollment_external_id is defined
      - isolate_enrollment_external_id is string
      - isolate_enrollment_external_id is match('^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}$')
      - isolate_enrollment_project is defined
      - isolate_enrollment_project is match('^[a-z0-9][a-z0-9-]{0,47}$')
      - isolate_enrollment_server_name is match('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')
      - isolate_enrollment_ssh_address is match('^([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]+)$')
      - isolate_enrollment_ssh_port | string is match('^[0-9]{1,5}$')
      - isolate_enrollment_ssh_port | int >= 1
      - isolate_enrollment_ssh_port | int <= 65535
      - isolate_enrollment_ssh_user is defined
      - isolate_enrollment_ssh_user is match('^[a-zA-Z][a-zA-Z0-9-]{0,47}$')
      - isolate_enrollment_tags is mapping
      - "'isolate_enrollment_id' not in isolate_enrollment_tags"
      - isolate_enrollment_known_hosts_files is sequence
      - isolate_enrollment_known_hosts_files is not string
      - isolate_enrollment_known_hosts_files is not mapping
      - isolate_enrollment_known_hosts_files | length > 0
      - isolate_enrollment_known_hosts_files | reject('match', '^/[^\s]+$') | list | length == 0
    fail_msg: Supply a pinned SSH target, bastion, project, stable ID, HTTPS API origin and trusted host-key file paths.

- name: Check that the workload access token is available
  ansible.builtin.assert:
    that: isolate_enrollment_token | trim | length > 0
  no_log: true

- name: Define the managed host fields
  ansible.builtin.set_fact:
    _isolate_hosts_url: "{{ isolate_enrollment_api_origin.rstrip('/') }}/api/v1/admin/hosts"
    _isolate_host_spec: >-
      {{ {'project_name': isolate_enrollment_project, 'server_name': isolate_enrollment_server_name,
          'server_ip': isolate_enrollment_ssh_address, 'server_port': isolate_enrollment_ssh_port | int,
          'server_user': isolate_enrollment_ssh_user} }}

- name: Read the scoped Isolate inventory
  ansible.builtin.uri:
    url: "{{ _isolate_hosts_url }}"
    headers:
      Authorization: "Bearer {{ isolate_enrollment_token }}"
    validate_certs: true
    ca_path: "{{ isolate_enrollment_tls_ca_file | default(omit) }}"
    follow_redirects: none
    use_netrc: false
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _isolate_inventory
  check_mode: false
  no_log: true

- name: Find the existing host by external ID
  ansible.builtin.set_fact:
    _isolate_matches: >-
      {{ _isolate_inventory.json.hosts | selectattr('tags.isolate_enrollment_id', 'defined')
         | selectattr('tags.isolate_enrollment_id', 'equalto', isolate_enrollment_external_id) | list }}

- name: Resolve the host identity before making changes
  ansible.builtin.assert:
    that:
      - _isolate_matches | length <= 1
      - _isolate_matches | length == 0 or _isolate_matches[0].project_name == isolate_enrollment_project
      - _isolate_matches | length == 0 or not (_isolate_matches[0].proxy_id | default(None))
      - >-
        isolate_enrollment_server_id is undefined or (_isolate_matches | length == 1
        and _isolate_matches[0].server_id | string == isolate_enrollment_server_id | string)
      - >-
        _isolate_inventory.json.hosts | selectattr('project_name', 'equalto', isolate_enrollment_project)
        | selectattr('server_ip', 'equalto', isolate_enrollment_ssh_address)
        | selectattr('server_port', 'equalto', isolate_enrollment_ssh_port | int)
        | rejectattr('server_id', 'equalto', (_isolate_matches | first | default({})).server_id | default(''))
        | list | length == 0
    fail_msg: Reconcile the external ID, project and address in Isolate. This role enrolls directly reachable SSH targets.

- name: Preserve unmanaged inventory tags
  ansible.builtin.set_fact:
    _isolate_existing_host: "{{ _isolate_matches | first | default({}) }}"
    _isolate_desired_host: >-
      {{ _isolate_host_spec | combine({'tags': ((_isolate_matches | first | default({})).tags | default({}))
         | combine(isolate_enrollment_tags, {'isolate_enrollment_id': isolate_enrollment_external_id})}) }}

- name: Determine if the registration needs an update
  ansible.builtin.set_fact:
    _isolate_inventory_current: >-
      {{ (_isolate_existing_host | dict2items | selectattr('key', 'in', _isolate_desired_host.keys())
         | list | items2dict) == _isolate_desired_host }}

- name: Show the planned inventory operation in check mode
  ansible.builtin.debug:
    msg: >-
      {{ 'Inventory already current' if _isolate_inventory_current else
         ('Would update Isolate host ' ~ _isolate_existing_host.server_id if _isolate_existing_host else 'Would add a host to Isolate') }}
  when: ansible_check_mode

- name: Provision SSH trust and register the host
  ansible.builtin.include_tasks:
    file: apply.yml
    apply:
      vars:
        ansible_connection: ssh
        ansible_ssh_host_key_checking: true
        # Avoid reusing a transport from the deployment playbook.
        ansible_ssh_args: '-o StrictHostKeyChecking=yes -o ControlMaster=no -o ControlPath=none'
  when: not ansible_check_mode
